name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install lightweight dependencies
        run: |
          pip install --upgrade pip
          pip install fastapi uvicorn pydantic pydantic-settings \
                      httpx loguru python-dotenv requests \
                      pytest pytest-asyncio pytest-cov

      - name: Run parser and API tests only
        run: |
          pytest tests/test_parser.py tests/test_api.py tests/test_inference.py -v
        env:
          GITHUB_TOKEN: dummy_token
          GITHUB_WEBHOOK_SECRET: dummy_secret
          HF_TOKEN: dummy_hf_token
          MODEL_PATH: ./models
          DEVICE: cpu
          USE_4BIT: "false"